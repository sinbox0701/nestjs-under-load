choose:
  - when: "여럿이 같은 문서를 읽고 고쳐 저장하는 일반적인 편집 화면"
    pick: optimistic-version
    because: "편집 동안 아무것도 잡지 않아 다른 사람을 막지 않고, 같은 버전에서 출발한 저장 중 하나만 통과시킨다. 클라이언트는 GET 때 받은 version을 본문에 들고 오고, 409를 받으면 다시 GET → 재적용 → 새 버전으로 PUT 한다"
    avoid: [naive-overwrite, blind-retry]
  - when: "409를 받았다 (재시도를 어떻게 짤까)"
    pick: optimistic-version
    because: "올바른 재시도는 최신본을 다시 읽어 내 변경을 그 위에 다시 적용하는 것이다. 응답의 currentVersion만 바꿔 같은 본문을 다시 보내면 서버 검사를 통과하면서 앞사람 수정을 지운다"
    avoid: [blind-retry]
  - when: "문서가 독립적인 필드(섹션)로 나뉘고, 사람마다 주로 다른 필드를 고친다"
    pick: field-merge
    because: "같은 필드끼리만 충돌하므로 409와 재작업이 줄어든다. 단 필드 경계가 의미 경계와 맞을 때만 쓴다. 서로 의존하는 필드를 따로 병합하면 각각은 맞아도 합친 문서가 틀릴 수 있다"
    avoid: [naive-overwrite, blind-retry]
  - when: "충돌 뒤 재적용이 비싸다 (편집이 길고, 사람이 손으로 병합해야 한다)"
    pick: edit-lease
    because: "편집 전에 잠금을 잡아 충돌 자체를 없앤다. 대신 TTL을 최대 편집 시간보다 길게 잡고, fence를 save·release에 반드시 싣고, 423 폴링과 순서 보장 없음(굶주림)을 감수한다. 만료 판단은 DB 시계로 한다"
    avoid: [naive-overwrite, blind-retry]
  - when: "한 문서에 동시 편집자가 많다 (핫 문서)"
    pick: optimistic-version
    because: "재적용이 짧으면 409 뒤 재시도 창이 몇 ms라 대부분 회복되고, 처리량은 행 쓰기 한계까지 간다. lease는 편집 시간 전체를 한 줄로 세워 처리량이 1 / 편집 시간에 묶인다. 근본 해법은 문서를 쪼개 경합 단위를 줄이는 것이다"
    avoid: [edit-lease, blind-retry]
  - when: "같은 엔티티를 쓰는 경로가 여럿이다 (ORM flush 외에 nativeUpdate·raw SQL·배치)"
    pick: optimistic-version
    because: "버전 검사는 경로마다 WHERE version으로 있어야 한다. nativeUpdate는 version을 올리기만 하고 비교하지 않으므로, 한 경로라도 빠지면 그곳이 덮어쓰기 구멍이 된다"
    avoid: [naive-overwrite]
