# G01 학습 데이터 (규약: learn.yaml, 2026-10-07 — DESIGN §6.5, G02 learn.yaml 과 같은 규약)
# - 코드 줄은 마커로 찾는다: 소스 줄 끝 주석 `// @learn <id> — <설명>`. 계측 마커 `// @event <phase…>`와 한 줄에 같이 두지 않는다.
# - focus.file은 이 시나리오 폴더 기준 경로. 줄 번호는 쓰지 않는다. 코드 실험실은 strategies/*.strategy.ts 만 읽으므로 focus 도 그 파일만 가리킨다.
#   blind-retry 는 서버 구현이 optimistic-version 과 같아서(클래스 상속, id 만 다름) 그 파일의 마커를 가리킨다. 차이는 k6 클라이언트(k6/client.mjs blindRetryBody)다.
# - outcomes.expected는 예상이다. PostgreSQL·MikroORM 동작에서 추론했고, "단순 모델 추정"이라고 쓴 수치는 요청 왕복 1~2ms·행 쓰기 2~4ms를 가정하고
#   k6 클라이언트 규칙(재적용 3회, 맹목 재시도 1회, lease 폴링 20ms·대기 상한 10초)을 흉내 낸 이산 사건 계산의 대략값이다. 실측과 다를 수 있다.
#   measured는 실측(run id·수치). 실측 전에는 null. 채우는 것은 실행기(measured 계산)이고 사람이 쓰지 않는다.
# - sql은 이 팩 코드가 실제로 보내는 문장의 예(값은 예시). 한 번의 HTTP 흐름 순서로 적었다(GET 은 컨트롤러의 자동 커밋 읽기, 409 본문의 current 재조회 포함).
#   MikroORM은 파라미터를 문자열에 채워서 보낸다. begin·commit 은 적지 않는다. 0행으로 끝나는 UPDATE 는 why 에서 설명한다.
# - situations.data.documents·scenarioParams.editMs 는 k6 env DOC_MAX·EDIT_MS 로, params 는 strategy 파라미터(RunConfig)로 간다.
# - 검증: test/learn.test.mjs (전 조합, 마커 존재·고아 마커, sql 형태가 실제 생성 SQL과 일치, verdict 규칙)
scenario: g01-shared-document
title: 같은 문서 동시 수정

concepts:
  - id: lost-update
    label: 잃어버린 갱신 (lost update)
    body: >-
      두 사람이 같은 버전을 읽고 각자 고쳐 저장하면, 늦게 저장한 쪽이 앞사람 수정을 덮어써서 앞사람 수정이 사라진다.
      G01에서는 "읽은 배열 뒤에 내 토큰을 붙여 저장"하므로, 서버가 성공이라고 답한 토큰이 최종 문서에 없으면 그것이 잃어버린 갱신이다.
      응답은 둘 다 200이라 클라이언트도 서버 로그도 알아채지 못한다.
      그래서 판정은 응답이 아니라 DB에 남은 사실로 한다. 원장의 성공 토큰과 최종 문서를 대조하는 불변식 no_lost_update가 그 역할이다.
  - id: tx-boundary
    label: 트랜잭션 경계 (읽기와 저장은 다른 트랜잭션)
    body: >-
      화면을 여는 GET은 SELECT 한 문장(자동 커밋)이고, 저장은 em.transactional 안에서 UPDATE와 원장·이력 INSERT를 함께 커밋한다.
      둘은 서로 다른 트랜잭션이고 그 사이에 사람의 편집 시간(실제로는 초~분, 실험실에서는 ms로 압축)이 끼어 있다.
      DB는 각 트랜잭션 안쪽만 보므로 "이 저장이 몇 번 버전을 보고 만든 것인가"를 모른다. 그 증거는 클라이언트가 본문 version으로 들고 와야 한다.
      저장 트랜잭션은 원장·이력을 문서 UPDATE와 같이 커밋해 불변식 판정 근거를 만들 뿐, 덮어쓰기 자체를 막지는 않는다.
  - id: serializable-cannot-help
    label: SERIALIZABLE로도 못 막는 이유
    body: >-
      격리 수준을 SERIALIZABLE로 올려도 G01의 덮어쓰기는 막히지 않는다.
      PostgreSQL의 직렬화 검사는 한 트랜잭션 안에서 일어난 읽기와 쓰기의 의존만 보는데, 여기서는 읽기(GET)와 쓰기(PUT)가 서로 다른 트랜잭션이기 때문이다.
      읽기와 쓰기가 한 트랜잭션 안이었다면 REPEATABLE READ 이상에서 늦은 쪽이 40001(could not serialize access)로 중단된다.
      하지만 사람의 편집 시간 동안 트랜잭션(=풀 커넥션)을 열어 둘 수는 없다. 그래서 버전 번호를 클라이언트가 들고 오는 낙관 락, 또는 편집 전에 잡는 잠금(lease)이 필요하다.
  - id: optimistic-two-failure-points
    label: 낙관 락의 두 실패 지점
    body: >-
      MikroORM 낙관 락은 두 곳에서 실패한다. ① findOneOrFail(…, { lockMode: OPTIMISTIC, lockVersion })은 읽어 온 엔티티의 version을 메모리에서 `!==`로 비교만 한다(락 SQL이 아니다).
      ② flush가 보내는 `UPDATE … SET version = version + 1 WHERE id = ? AND version = ?`가 0행이면 OptimisticLockError가 난다.
      같은 순간에 도착한 두 저장은 ①을 둘 다 통과할 수 있으므로, 동시성을 실제로 가르는 것은 ②다. ①은 이미 늦은 요청을 SQL 한 번 덜 쓰고 미리 거르는 최적화다.
      둘 다 409 version_mismatch로 응답하고, 트랜잭션 밖에서 현재 version을 다시 읽어 currentVersion으로 돌려준다.
      lockVersion이 undefined면 검사를 건너뛰고 문자열 '3'은 숫자 3과 불일치라, 컨트롤러가 누락을 428로 거절하고 number로 바꿔 넘긴다.
  - id: rc-recheck
    label: READ COMMITTED 재평가 (EvalPlanQual)
    body: >-
      READ COMMITTED에서 UPDATE가 다른 트랜잭션이 바꾸고 있는 행을 만나면 그 트랜잭션이 끝날 때까지 행 잠금을 기다린다.
      상대가 커밋하면 그 행의 최신 버전으로 WHERE를 다시 평가하고(PostgreSQL 내부 이름 EvalPlanQual), 거짓이 되면 그 행을 건너뛰어 0행이 된다.
      그래서 `WHERE version = 2`는 앞사람이 version을 3으로 올린 뒤 재평가에서 거짓이 되어 동시 UPDATE 중 정확히 하나만 1행이다.
      반대로 `WHERE id = 1`뿐인 UPDATE는 재평가를 그대로 통과해 앞사람 내용을 덮는다. 조건부 UPDATE가 곧 동시성 제어가 되는 이유다.
  - id: native-bypasses-version
    label: nativeUpdate는 버전 검사를 우회한다
    body: >-
      엔티티에 `version: true` 컬럼이 있어도 보호는 flush가 만드는 `UPDATE … WHERE version = ?`에만 있다.
      em.nativeUpdate는 Unit of Work를 거치지 않고 UPDATE를 바로 보낸다. 이 팩의 실제 SQL을 보면 `"version" = "version" + 1`은 붙지만 WHERE에는 version 조건이 없다.
      버전 값은 올라가는데 아무도 비교하지 않으니 낙관 락이 무력하다.
      쓰기 경로가 여럿이면(nativeUpdate, raw SQL, 배치) 경로마다 WHERE version을 걸어야 한다. 하나라도 빠지면 그 경로가 덮어쓰기 구멍이 된다.
  - id: blind-retry-loss
    label: 맹목 재시도의 유실
    body: >-
      409를 "버전만 새로 받으면 되는 일시 오류"로 오해하면, 클라이언트가 응답의 currentVersion만 꺼내 같은 본문으로 다시 PUT 한다.
      재시도의 version은 현재 값이라 서버 검사(①·②)를 통과하고, 본문은 처음 읽은 옛 배열 + 내 토큰이라 그 사이 커밋된 앞사람 토큰이 사라진다.
      서버와 DB는 정상 저장으로 보고 409도 로그에 찍혀 있어 "충돌을 처리했다"처럼 보이지만 결과는 덮어쓰기와 같다.
      올바른 재시도는 다시 GET → 내 변경을 최신본에 다시 적용(병합 또는 사용자 결정) → 새 버전으로 PUT이다.
  - id: field-level-merge
    label: 필드 단위 병합
    body: >-
      field-merge는 바뀐 필드 하나만 PATCH 하고, WHERE는 문서 version이 아니라 그 필드가 마지막으로 바뀐 버전(field_versions)을 본다.
      다른 필드를 동시에 고친 UPDATE는 재평가에서 통과하고, SET에 없는 앞사람 필드는 최신 값 그대로 남는다. 같은 필드끼리만 409다.
      대가는 필드 경계가 의미 경계와 맞아야 한다는 것이다. 서로 의존하는 두 필드를 따로 병합하면 각각은 맞아도 합친 문서가 틀릴 수 있고, no_lost_update는 이것을 잡지 못한다.
      모든 PATCH가 같은 행을 UPDATE 하므로 행 잠금으로 줄을 서는 구조와 처리량 한계는 그대로다.
  - id: status-409-vs-423
    label: 409와 423을 나눈 이유
    body: >-
      저장 실패(version_mismatch, lease_lost, lease_expired)는 모두 409이고 본문 reason으로 구분한다.
      셋 다 "내가 알던 상태가 현재와 다르다"는 같은 종류의 충돌이라, 클라이언트가 같은 복구 절차(다시 GET → 재적용)를 타면 된다.
      423 Locked는 WebDAV(RFC 4918) 코드를 빌린 것으로, edit-lease의 acquire 거절(지금 다른 사람이 잠금을 쥐고 있음)에만 쓰고 Retry-After를 함께 보낸다.
      423은 저장이 아니라 자원 점유에 대한 답이라 "기다렸다 다시"가 복구 방법이다. 버전 누락은 428이다.
  - id: lease-no-queue
    label: lease는 서버 줄 세우기가 아니다 (FIFO 없음)
    body: >-
      edit-lease의 acquire는 조건부 UPDATE 한 문장이다. 비었거나·내 것이거나·만료됐으면 가져가고, 아니면 0행 → 423으로 바로 거절한다.
      서버는 기다리는 사람 목록을 갖지 않는다. 423을 받은 클라이언트가 각자 다시 노크(폴링)하고, 잠금이 풀린 순간 먼저 노크한 사람이 가져간다.
      도착 순서가 보장되지 않으니 운 나쁜 사람은 계속 밀릴 수 있고(굶주림), 풀리는 순간 여럿이 한꺼번에 몰린다.
      대신 기다리는 동안 DB 커넥션·트랜잭션을 쥐지 않는다. 잠금을 쥔 채 사라진 사람의 잠금은 lease_until이 지나면 다음 acquire가 회수한다(TTL).
  - id: fencing-token
    label: fencing 토큰 (fence)
    body: >-
      fence는 acquire 때마다 1씩 오르는 번호이고, 클라이언트가 save·release에 들고 와야 한다.
      잠금을 쥐었다고 믿는 클라이언트가 멈췄다 깨어나면(GC, 네트워크 단절, 긴 편집) 그 사이 TTL이 지나 다른 사람이 잠금을 가져갔을 수 있다.
      save는 `WHERE locked_by = ? AND fence = ? AND lease_until > clock_timestamp()` 조건부 UPDATE라, 옛 세션의 늦은 저장은 0행 → 409 lease_lost로 걸러진다.
      검사를 저장하는 쪽(DB의 같은 UPDATE)이 하므로 앱 쪽에서 "아직 내 잠금인가"를 따로 확인하는 사이의 틈이 없다. 같은 사람이 다시 잡아도 fence가 올라 옛 세션은 걸러진다.
  - id: db-clock
    label: DB 시계 (clock_timestamp와 now)
    body: >-
      lease 만료 시각과 유효 판단은 모두 DB 시계 clock_timestamp()로 계산한다. 앱 서버 시계는 인스턴스마다 어긋나므로 쓰지 않는다.
      PostgreSQL의 now()(= transaction_timestamp())는 트랜잭션 시작 시각이라 한 트랜잭션 안에서 멈춰 있다.
      저장 트랜잭션 안에서 기다린 시간(경합 창, 잠금 대기)이 있으면 now()는 그만큼 과거 시각이라 이미 만료된 잠금을 유효하다고 판단할 수 있다.
      clock_timestamp()는 호출한 순간의 실제 시각이다.

situations:
  - id: two-people-one-doc
    label: 사람 2명 · 문서 1개 · 서버 1대
    load: { model: closed, vus: 2, shape: constant, duration: 30s }
    instances: 1
    chaos: none
    data: { documents: 1, distribution: { kind: uniform } }
    scenarioParams: { editMs: 50 }
    note: >-
      두 사람이 같은 문서를 쉬지 않고 연다(GET) → 50ms 고친다 → 저장한다. 편집 50ms는 실제의 초~분을 압축한 값이라 충돌 빈도는 실제보다 훨씬 높다(메커니즘 관찰용).
      한 사람의 편집 창(GET~저장) 안에 상대의 저장이 거의 늘 한 번 끼므로, 사람이 둘뿐이어도 경합이 꾸준히 생긴다.
  - id: twenty-people-one-doc
    label: 사람 20명 · 문서 1개 · 서버 2대
    load: { model: closed, vus: 20, shape: constant, duration: 30s }
    instances: 2
    chaos: none
    data: { documents: 1, distribution: { kind: uniform } }
    scenarioParams: { editMs: 50 }
    note: >-
      한 문서를 20명이 동시에 고친다. nginx가 두 인스턴스에 번갈아 보낸다. G01의 strategy는 모두 DB 행(version·field_versions·locked_by)에서
      판정하므로 서버 대수는 결과의 성격을 바꾸지 않는다(G02의 메모리 락과 대비). 같은 행에 대한 쓰기가 몰려 행 잠금 직렬화가 처리량 한계가 된다.
  - id: zipf-100-docs
    label: 사람 20명 · 문서 100개 Zipf(s=1.1) · 서버 2대
    load: { model: closed, vus: 20, shape: constant, duration: 30s }
    instances: 2
    chaos: none
    data: { documents: 100, distribution: { kind: zipf, s: 1.1 } }
    scenarioParams: { editMs: 50 }
    note: >-
      문서 100개 중 문서 1이 요청의 약 23%, 문서 2가 약 11%를 받는다(Zipf s=1.1). 대부분의 문서는 거의 겹치지 않고 상위 몇 개에 충돌이 몰린다.
      평균은 괜찮아 보여도 핫 문서에서 무슨 일이 나는지가 판정을 정한다.
  - id: lease-short-ttl
    label: lease TTL 100ms < 편집 150ms · 사람 5명 · 문서 1개
    load: { model: closed, vus: 5, shape: constant, duration: 30s }
    instances: 1
    chaos: none
    params: { edit-lease: { ttlMs: 100 } }
    data: { documents: 1, distribution: { kind: uniform } }
    scenarioParams: { editMs: 150 }
    note: >-
      edit-lease의 잠금 유지 시간(ttlMs)을 편집 시간보다 짧게 잡은 설정 실수다. 보유자가 아직 편집 중인데 잠금이 만료되고,
      20ms마다 노크하던 다른 사람이 회수한다. ttlMs는 edit-lease 파라미터라 다른 strategy에는 "편집 150ms · 5명 · 문서 1개" 조건으로만 작용한다.
  - id: contention-window-30
    label: 경합 창 30ms 주입 · 편집 0ms · 사람 10명 · 문서 1개
    load: { model: closed, vus: 10, shape: constant, duration: 30s }
    instances: 1
    chaos: none
    injected: { contentionWindowMs: 30 }
    data: { documents: 1, distribution: { kind: uniform } }
    scenarioParams: { editMs: 0 }
    note: >-
      사람 편집 시간을 0으로 두고, 모든 strategy의 같은 지점(after-read: 저장 트랜잭션 안, 문서를 읽은 뒤 쓰기 전. 트랜잭션 안에서 읽지 않는 strategy는 UPDATE 직전)에
      30ms를 인위로 넣는다. 경합 창은 사람 편집만이 아니라 서버 안 처리 시간에서도 생긴다는 것을 보인다. 주입된 조건이므로 결과에 "주입됨"으로 표시한다.
      edit-lease는 이 30ms가 잠금(lease) 보유 시간에 더해진다.

outcomes:
  # ── naive-overwrite ────────────────────────────────────────────────────────
  - strategy: naive-overwrite
    situation: two-people-one-doc
    verdict: broken
