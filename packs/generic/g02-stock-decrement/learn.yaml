choose:
  - when: "한 행의 숫자를 조건에 맞을 때만 줄이면 된다 (재고·좌석·쿠폰 잔량)"
    pick: conditional-update
    because: "판정과 차감이 한 문장이라 잠금 보유 시간이 가장 짧고, 인스턴스 수와 무관하게 맞다. 영향 행 수로 성공/품절을 바로 안다"
    avoid: [no-lock, app-memory-lock]
  - when: "읽은 값으로 앱에서 여러 규칙을 판정해야 해서 한 문장 UPDATE로 표현하기 어렵다"
    pick: row-lock
    because: "FOR UPDATE로 잠근 최신 값을 앱이 마음껏 판정할 수 있다. 대신 잠근 뒤 커밋까지를 짧게 유지하고 lock_timeout을 SET LOCAL로 반드시 건다"
    avoid: [no-lock, app-memory-lock]
  - when: "인기 상품 하나에 요청이 몰린다 (핫 로우)"
    pick: conditional-update
    because: "처리량 천장 ≈ 1/보유 시간이므로 보유 시간이 짧은 쪽이 유리하다. 그래도 모자라면 재고 분할·요청 모아 처리 같은 구조 변경을 검토한다"
    avoid: [row-lock, app-memory-lock]
  - when: "앱 서버가 2대 이상이거나 앞으로 늘어날 수 있다"
    pick: conditional-update
    because: "직렬화를 DB 행이 맡으므로 인스턴스 수에 영향받지 않는다. 메모리 mutex는 1대에서 통과해도 2대에서 깨진다"
    avoid: [app-memory-lock, no-lock]
  - when: "오래 기다리게 하느니 빨리 거절하는 편이 낫다 (마감 이벤트, 사용자 재시도 가능)"
    pick: row-lock
    because: "SET LOCAL lock_timeout으로 대기 상한을 정하고 55P03을 503으로 돌려줄 수 있다. 거절된 요청은 롤백되어 원장·재고에 흔적이 없다"
    avoid: [app-memory-lock]
  - when: "DB 왕복 지연이 크거나 들쭉날쭉하다"
    pick: conditional-update
    because: "트랜잭션 안 왕복 수가 곧 보유 시간이다. 왕복이 가장 적은 방식이 지연 증가에 가장 덜 흔들린다"
    avoid: [row-lock, app-memory-lock]
  - when: "락이 보호할 대상이 DB 한 곳이 아니다 (외부 API 호출·다른 저장소 갱신을 한 번에 한 요청씩 하고 싶다)"
    pick: redis-lock
    because: "DB 트랜잭션 밖의 작업도 하나의 키로 줄 세울 수 있고 앱이 몇 대든 맞다. 대신 Redis 왕복·재시도 지연·장애 시 거절을 감수하고, TTL이 작업 시간보다 길게 유지되는지 계속 확인해야 한다. 데이터가 같은 DB 안에 있으면 굳이 쓸 이유가 약하다"
    avoid: [app-memory-lock]
  - when: "행이 아직 없거나 한 문장 UPDATE로 못 쓰는 규칙인데, 락을 DB 안에서 해결하고 싶다"
    pick: advisory-xact-lock
    because: "행이 없어도 숫자 키로 잠가 직렬화하고 트랜잭션이 끝나면 자동으로 풀린다. TTL·소유자 확인이 필요 없다. 대신 키 공간을 앱이 관리해야 하고, 같은 방식으로 락을 거는 코드끼리만 서로를 막는다"
    avoid: [no-lock, app-memory-lock]
