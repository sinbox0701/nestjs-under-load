# 웹 정적 서빙 + orchestrator 프록시(T-120). 비루트 실행(nginx-unprivileged)이라 pid·임시 경로를 /tmp 로 둔다.
pid /tmp/nginx.pid;
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # 컨테이너 DNS 로 재해석(orchestrator 가 늦게 떠도 nginx 가 기동에 실패하지 않게 변수 proxy_pass 를 쓴다).
  resolver 127.0.0.11 valid=5s ipv6=off;

  # WS 업그레이드일 때만 Connection: upgrade, 아니면 keepalive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # 보안 헤더. frame-ancestors 'self' 는 웹 자신이 임베드되는 쪽만 막는다.
    # 웹이 Grafana 를 iframe 으로 넣는 것은 이 응답의 헤더와 무관하고(Grafana 쪽 allow_embedding 몫), 여기서 frame-src 는 제한하지 않는다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "same-origin" always;

    # REST: /api/x → orchestrator:4000/x (접두 제거). Origin·Host 는 바꾸지 않는다(오케 Origin 가드가 원래 값을 본다).
    location /api/ {
      set $orch http://orchestrator:4000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $orch;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_read_timeout 60s;
    }

    # WS: 접두 그대로 전달, Upgrade·Connection 헤더 전달, 장시간 연결 유지.
    location /ws/ {
      set $orch http://orchestrator:4000;
      proxy_pass $orch;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # 해시된 정적 자산은 장기 캐시, index.html 은 캐시 금지.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "frame-ancestors 'self'" always;
      add_header Referrer-Policy "same-origin" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "frame-ancestors 'self'" always;
      add_header Referrer-Policy "same-origin" always;
      try_files $uri /index.html;
    }
  }
}
