    why: 서버마다 Map이 따로 있다. A 서버와 B 서버의 요청은 서로의 락을 모른 채 같은 행을 읽고 상수를 쓴다.
    focus:
      - { file: strategies/app-memory-lock.strategy.ts, marker: per-instance-map }
      - { file: strategies/app-memory-lock.strategy.ts, marker: write-computed }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1
      - update g02_product set stock = $1 where id = $2
    concepts: [process-local, lost-update]
  - strategy: app-memory-lock
    situation: db-slow
    verdict: broken
    expected: 초과 판매 + 앱 안 대기 증가
    measured: null
    why: 서버 2대라 깨지는 건 같고, 지연 때문에 서버 안 대기열도 길어진다. 느리면서 틀린 최악의 조합.
    focus:
      - { file: strategies/app-memory-lock.strategy.ts, marker: per-instance-map }
      - { file: strategies/app-memory-lock.strategy.ts, marker: read-inside-mutex }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1
      - update g02_product set stock = $1 where id = $2
    concepts: [process-local]
  - strategy: app-memory-lock
    situation: small-pool
    verdict: broken
    expected: 초과 판매(서버 2대)
    measured: null
    why: 풀 크기와 무관하게 서버 간 락이 없다.
    focus:
      - { file: strategies/app-memory-lock.strategy.ts, marker: per-instance-map }
    sql:
      - update g02_product set stock = $1 where id = $2
    concepts: [process-local]

  # ── row-lock ──────────────────────────────────────────────
  - strategy: row-lock
    situation: two-users-one-instance
    verdict: ok
    expected: 위반 0
    measured: null
    why: 두 번째 요청은 FOR UPDATE에서 첫 번째의 커밋을 기다린 뒤 최신 재고를 읽는다.
    focus:
      - { file: strategies/row-lock.strategy.ts, marker: for-update }
    sql:
      - set local lock_timeout = '1000ms'
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1 for update
      - update g02_product set stock = $1 where id = $2
    concepts: [row-lock]
  - strategy: row-lock
    situation: hundred-one-instance
    verdict: ok
    expected: 위반 0, 잠금 대기로 p95 증가
    measured: null
    why: DB가 서버 대수와 상관없이 한 줄로 세운다. 대기는 pg_locks / wait_event=Lock 으로 보인다.
    focus:
      - { file: strategies/row-lock.strategy.ts, marker: for-update }
      - { file: strategies/row-lock.strategy.ts, marker: hold-while-thinking }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1 for update
      - update g02_product set stock = $1 where id = $2
    concepts: [row-lock, hot-row]
  - strategy: row-lock
    situation: spike-200-two-instances
    verdict: slow
    expected: 위반 0, 몰림 구간 p95 급증
    measured: null
    why: 맞지만 한 행에 몰리면 처리량 상한이 1/(보유 시간)이 된다. 잠금을 쥔 채 SELECT 왕복·계산·UPDATE·원장 INSERT를 모두 하므로 보유 시간이 길다.
    focus:
      - { file: strategies/row-lock.strategy.ts, marker: hold-while-thinking }
      - { file: strategies/row-lock.strategy.ts, marker: release-at-commit }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1 for update
      - update g02_product set stock = $1 where id = $2
      - insert into g02_order_ledger (...) values (...)
    concepts: [row-lock, hot-row]
  - strategy: row-lock
    situation: db-slow
    verdict: rejects
    expected: 위반 0, lock_timeout(55P03) 실패 다수
    measured: null
    why: 잠금 보유 중 DB 왕복이 4번(SET, SELECT FOR UPDATE, UPDATE, INSERT+COMMIT)이라 보유 시간이 200ms를 넘는다. 줄에 선 요청이 1초 상한을 넘겨 거절된다.
    focus:
      - { file: strategies/row-lock.strategy.ts, marker: lock-timeout }
      - { file: strategies/row-lock.strategy.ts, marker: release-at-commit }
    sql:
      - set local lock_timeout = '1000ms'
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1 for update
