  - strategy: conditional-update
    situation: two-users-one-instance
    verdict: ok
    expected: 위반 0
    measured: null
    why: 검사와 차감이 한 문장이다. 두 번째 UPDATE는 첫 번째 커밋을 기다린 뒤 최신 재고로 WHERE를 다시 평가한다.
    focus:
      - { file: strategies/conditional-update.strategy.ts, marker: atomic-decrement }
      - { file: strategies/conditional-update.strategy.ts, marker: guard-in-where }
    sql:
      - update g02_product set stock = stock - $1 where id = $2 and stock >= $3
    concepts: [eval-plan-qual]
  - strategy: conditional-update
    situation: hundred-one-instance
    verdict: ok
    expected: 위반 0, row-lock보다 낮은 p95
    measured: null
    why: SELECT 왕복이 없고 잠금은 UPDATE부터 COMMIT까지만 쥔다. 같은 행 대기열이 row-lock보다 빨리 빠진다.
    focus:
      - { file: strategies/conditional-update.strategy.ts, marker: atomic-decrement }
      - { file: strategies/conditional-update.strategy.ts, marker: short-hold }
    sql:
      - update g02_product set stock = stock - $1 where id = $2 and stock >= $3
      - insert into g02_order_ledger (...) values (...)
    concepts: [eval-plan-qual, hot-row]
  - strategy: conditional-update
    situation: spike-200-two-instances
    verdict: ok
    expected: 위반 0, 소진 뒤 영향 행 0 → 품절 응답
    measured: null
    why: 서버 대수와 무관하게 DB가 행 단위로 직렬화한다. 재고가 바닥나면 WHERE가 거짓이 되어 영향 행 0 → 품절로 끝난다.
    focus:
      - { file: strategies/conditional-update.strategy.ts, marker: guard-in-where }
      - { file: strategies/conditional-update.strategy.ts, marker: affected-rows }
    sql:
      - update g02_product set stock = stock - $1 where id = $2 and stock >= $3
      - "-- 재고 소진 뒤: UPDATE 0"
    concepts: [eval-plan-qual]
  - strategy: conditional-update
    situation: db-slow
    verdict: ok
    expected: 위반 0, 거절 없음(보유 시간이 왕복 2번)
    measured: null
    why: 잠금을 쥔 동안 왕복은 UPDATE와 INSERT+COMMIT 두 번뿐이다. 지연이 들어가도 row-lock의 절반 수준이라 lock_timeout까지 가지 않는다.
    focus:
      - { file: strategies/conditional-update.strategy.ts, marker: short-hold }
    sql:
      - update g02_product set stock = stock - $1 where id = $2 and stock >= $3
      - insert into g02_order_ledger (...) values (...)
    concepts: [hot-row]
  - strategy: conditional-update
    situation: small-pool
    verdict: ok
    expected: 위반 0, 풀 대기 짧음
    measured: null
    why: 트랜잭션이 짧아 커넥션을 빨리 돌려준다. 같은 풀에서 row-lock보다 많은 요청을 처리한다.
    focus:
      - { file: strategies/conditional-update.strategy.ts, marker: short-hold }
    sql:
      - update g02_product set stock = stock - $1 where id = $2 and stock >= $3
    concepts: [hot-row]

choose:
  - when: 재고 숫자 하나만 원자적으로 줄이면 된다
    pick: conditional-update
    because: 검사와 차감을 한 문장에 넣으면 DB가 잠금 대기 뒤 최신 값으로 다시 평가해 준다. 가장 짧게 잠근다.
    avoid: [no-lock, app-memory-lock]
  - when: 읽은 값으로 여러 규칙(한도·쿠폰·옵션 재고)을 검사한 뒤 써야 한다
    pick: row-lock
    because: 조건을 WHERE 한 줄로 못 담으면 읽는 순간 잠가야 한다. 대신 잠금 안에서 하는 일을 최소로 줄인다.
    avoid: [no-lock]
  - when: 인기 상품 하나에 순간 몰림 + DB가 느릴 수 있다
    pick: conditional-update
    because: 처리량 상한이 잠금 보유 시간에 달려 있다. 왕복이 적은 쪽이 지연에 덜 무너진다.
    avoid: [row-lock, app-memory-lock]
  - when: 지금은 서버 1대지만 늘릴 수 있다
    pick: conditional-update
    because: 프로세스 메모리 락은 대수를 늘리는 순간 조용히 깨진다. 처음부터 DB가 보장하게 둔다.
    avoid: [app-memory-lock]
