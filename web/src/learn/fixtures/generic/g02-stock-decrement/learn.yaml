    concepts: [lock-timeout, hot-row]
  - strategy: row-lock
    situation: small-pool
    verdict: slow
    expected: 위반 0, 풀 대기 증가
    measured: null
    why: 잠금을 기다리는 트랜잭션도 커넥션을 쥔다. 풀 5개가 모두 같은 행 대기에 묶이면 다른 상품 요청까지 풀 앞에서 기다린다.
    focus:
      - { file: strategies/row-lock.strategy.ts, marker: for-update }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1 for update
    concepts: [row-lock, hot-row]

