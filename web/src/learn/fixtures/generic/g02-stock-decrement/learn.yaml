    verdict: ok
    expected: 위반 0
    measured: null
    why: 서버가 1대면 모든 요청이 같은 Map을 본다. 같은 상품 요청은 프로세스 안에서 한 줄로 선다.
    focus:
      - { file: strategies/app-memory-lock.strategy.ts, marker: memory-mutex }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1
      - update g02_product set stock = $1 where id = $2
    concepts: [process-local]
  - strategy: app-memory-lock
    situation: hundred-one-instance
    verdict: slow
    expected: 위반 0, p95 증가(앱 안 대기열)
    measured: null
    why: 맞지만 같은 상품 요청이 앱 메모리에서 한 줄로 기다린다. 대기는 DB가 아니라 Node 프로세스 안에 쌓여 pg_locks에 보이지 않는다.
    focus:
      - { file: strategies/app-memory-lock.strategy.ts, marker: wait-in-process }
    sql:
      - select p0.* from g02_product as p0 where p0.id = $1 limit 1
      - update g02_product set stock = $1 where id = $2
    concepts: [process-local, hot-row]
  - strategy: app-memory-lock
    situation: spike-200-two-instances
