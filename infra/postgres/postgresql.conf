# 고정 마운트 설정 파일(DESIGN §4.1). 해시가 실행 메타데이터 postgres.configHash로 남는다.
# 수치는 초기값일 뿐 성능 주장이 아니다(컨테이너 mem_limit 2g 기준).
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# 관측
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
track_activity_query_size = 4096

# 락 대기 로그(deadlock_timeout 이상 기다린 락)
log_lock_waits = on
deadlock_timeout = 1s

# 기본 격리 수준(명시). G02 학습 포인트는 READ COMMITTED 동작이다.
default_transaction_isolation = 'read committed'

log_timezone = 'UTC'
timezone = 'UTC'
