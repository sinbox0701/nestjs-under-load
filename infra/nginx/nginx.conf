# app 앞단 로드밸런서(round-robin). DESIGN §4.1 / §14 #1:
# nginx 1.27.3+ 오픈소스는 upstream `zone` + `server ... resolve` + `resolver`로 --scale된 app을 주기 재해석한다.
worker_processes 1;

events {
  worker_connections 4096;
}

http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;

  upstream app_upstream {
    zone app_upstream 64k;
    server app:3000 resolve;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $http_x_request_id;
      # 연결 실패만 다음 upstream으로. 이미 전달된 POST는 재전송하지 않는다(non_idempotent 미지정, DESIGN §12).
      proxy_next_upstream error;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }

    location = /nginx_status {
      stub_status;
      allow 127.0.0.1;
      deny all;
    }
  }
}
