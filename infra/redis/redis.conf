# 실험용 redis 설정(DESIGN §4.1). 락·멱등 저장 용도라 evict 하지 않는다(noeviction).
# 시나리오별로 정책이 필요하면 RunConfig 가 `CONFIG SET maxmemory-policy` 로 바꾼다(그 값은 메타데이터에 남긴다).
bind 0.0.0.0
protected-mode no
port 6379
# 디스크 영속화 없음: 실행마다 상태를 새로 만든다.
save ""
appendonly no
# 컨테이너 mem_limit(512m)보다 작게 둔다.
maxmemory 400mb
maxmemory-policy noeviction
